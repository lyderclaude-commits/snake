<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="fb-bande" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D4ED8"/><stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="fb-voile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A" stop-opacity="0"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect x="0" y="560" width="1080" height="260" fill="url(#fb-voile)"/>
  <!-- Bandeau plein : le fil de Facebook compresse fort, un aplat tient
       mieux qu'un dégradé discret. Il démarre à y = 0,775 × 1080 = 837. -->
  <rect x="0" y="806" width="1080" height="274" fill="url(#fb-bande)"/>
  <rect x="0" y="800" width="1080" height="10" fill="#F97316"/>
  <rect x="10" y="10" width="1060" height="1060" rx="30" fill="none" stroke="#2563EB" stroke-width="16"/>
  <circle cx="944" cy="130" r="60" fill="#F97316"/>
  <circle cx="944" cy="130" r="36" fill="none" stroke="#FFFFFF" stroke-width="11"/>
</svg>
