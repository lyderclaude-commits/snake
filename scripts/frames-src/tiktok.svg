<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="tt-voile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#0F172A" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="tt-filet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <!-- Le voile s'arrête au-dessus du cinquième bas : TikTok y pose sa
       légende et son nom de compte, tout ce qu'on y mettrait serait recouvert. -->
  <rect x="0" y="1080" width="1080" height="560" fill="url(#tt-voile)"/>
  <!-- Filet au-dessus du bloc de texte (y = 0,655 × 1920 = 1258) -->
  <rect x="98" y="1212" width="700" height="8" rx="4" fill="url(#tt-filet)"/>
  <!-- Encadrement, ramené à l'intérieur des zones sûres -->
  <rect x="14" y="14" width="1052" height="1892" rx="46" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.75"/>
  <!-- Repère de marque en haut À DROITE : le QR occupe le coin haut-gauche
       et le bord droit bas appartient aux boutons de l'application. -->
  <circle cx="946" cy="196" r="56" fill="#F97316"/>
  <circle cx="946" cy="196" r="33" fill="none" stroke="#FFFFFF" stroke-width="10"/>
</svg>
