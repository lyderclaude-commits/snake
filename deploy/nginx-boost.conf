# /etc/nginx/sites-available/boost.wakabileguide.com
#
#   sudo ln -s /etc/nginx/sites-available/boost.wakabileguide.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Posez ce fichier AVANT certbot : il crée le bloc :80, certbot ajoute le :443.

server {
    listen 80;
    listen [::]:80;
    server_name boost.wakabileguide.com;

    # Un cadre PNG peut peser jusqu'à 800 Ko ; la marge évite un 413 opaque.
    client_max_body_size 8M;

    # Les fichiers versionnés par Next portent un hachage dans leur nom :
    # leur contenu ne change jamais, on peut les garder très longtemps.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Sans cet en-tête, l'application se croit en HTTP et le cookie de
        # session perd son attribut Secure. La connexion cesserait de tenir.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
